
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Live Classroom</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        #login-box { max-width: 320px; margin: 60px auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        button { background: #28a745; color: white; font-weight: bold; cursor: pointer; }
        #classroom { display: none; max-width: 900px; margin: auto; }
        video { width: 100%; max-height: 280px; background: #000; border-radius: 6px; }
        canvas { background: #fff; border-radius: 6px; width: 100%; height: 250px; touch-action: none; }
        #chat-box { height: 150px; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .teacher-only { display: none; }
    </style>
</head>
<body>
    <div id="login-box">
        <h3>Join Private Class</h3>
        <input type="text" id="username" placeholder="Your Name" required>
        <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
        <input type="password" id="password" placeholder="Room Password" required>
        <button onclick="joinClass()">Enter Classroom</button>
        <p id="error-msg" style="color: #ff5555;"></p>
    </div>

    <div id="classroom">
        <h3>Live Class</h3>
        <video id="video" autoplay playsinline></video>
        <div class="teacher-only" id="teacher-controls">
            <button onclick="startBroadcast(false)">Start Mic & Camera</button>
            <button onclick="startBroadcast(true)" style="background:#007bff;">Share Screen & Mic</button>
        </div>

        <h4>Live Whiteboard</h4>
        <canvas id="board" width="600" height="250"></canvas>
        <button class="teacher-only" id="clear-btn" onclick="clearBoard()" style="background:#dc3545;">Clear Whiteboard</button>

        <div id="chat-box"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button onclick="sendChat()" style="width:30%;">Send</button>
        </div>
    </div>

    <script>
        let myName = '', myRole = '', myId = Math.random().toString(36).slice(2);
        let lastMsg = 0, lastStroke = 0, localStream = null;
        const peers = {};
        const rtcConfig = { iceServers: [{ urls: 'stun:://google.com' }] };

        async function joinClass() {
            myName = document.getElementById('username').value.trim();
            myRole = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            if (!myName || !password) return;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: myName, password, role: myRole })
            });
            const data = await res.json();
            if (!data.ok) {
                document.getElementById('error-msg').innerText = data.error;
                return;
            }

            if (myRole === 'teacher') myId = 'teacher';
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('classroom').style.display = 'block';
            if (myRole === 'teacher') {
                document.getElementById('teacher-controls').style.display = 'block';
                document.getElementById('clear-btn').style.display = 'block';
                document.getElementById('video').muted = true;
            } else {
                sendSignal('teacher', { type: 'student-join', from: myId });
            }
            setInterval(syncRoom, 1000);
        }

        async function syncRoom() {
            const res = await fetch(`/api/sync?afterMsg=${lastMsg}&afterStroke=${lastStroke}&myId=${myId}`);
            const data = await res.json();

            data.messages.forEach(m => {
                lastMsg = Math.max(lastMsg, m.id);
                const box = document.getElementById('chat-box');
                box.innerHTML += `<div><strong>${m.sender}:</strong> ${m.text}</div>`;
                box.scrollTop = box.scrollHeight;
            });

            data.strokes.forEach(s => {
                lastStroke = Math.max(lastStroke, s.id);
                if (myRole === 'teacher') return;
                if (s.clear) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                } else if (s.type === 'start') {
                    ctx.beginPath(); ctx.moveTo(s.x, s.y);
                } else {
                    ctx.lineTo(s.x, s.y); ctx.stroke();
                }
            });

            for (const sig of data.signals) handleSignal(sig);
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            const text = input.value;
            input.value = '';
            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: myName, text })
            });
        }

        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches.clientX : e.clientX;
            const cy = e.touches ? e.touches.clientY : e.clientY;
            return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (myRole !== 'teacher') return;
            drawing = true;
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
            fetch('/api/draw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'start', ...pos }) });
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!drawing || myRole !== 'teacher') return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y); ctx.stroke();
            fetch('/api/draw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'move', ...pos }) });
        });

        canvas.addEventListener('pointerup', () => { drawing = false; });

        function clearBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fetch('/api/draw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clear: true }) });
        }

        function sendSignal(to, payload) {
            fetch('/api/signal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to, from: myId, ...payload }) });
        }

        async function startBroadcast(useScreen) {
            localStream = useScreen
                ? await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                : await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('video').srcObject = localStream;
        }

        async function handleSignal(sig) {
            if (sig.type === 'student-join' && localStream) {
                const pc = new RTCPeerConnection(rtcConfig);
                peers[sig.from] = pc;
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
                pc.onicecandidate = e => { if (e.candidate) sendSignal(sig.from, { type: 'candidate', candidate: e.candidate }); };
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendSignal(sig.from, { type: 'offer', sdp: offer });
            } else if (sig.type === 'offer') {
                const pc = new RTCPeerConnection(rtcConfig);
                peers['teacher'] = pc;
                pc.ontrack = e => { document.getElementById('video').srcObject = e.streams; };
                pc.onicecandidate = e => { if (e.candidate) sendSignal('teacher', { type: 'candidate', candidate: e.candidate }); };
                await pc.setRemoteDescription(sig.sdp);
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal('teacher', { type: 'answer', sdp: answer });
            } else if (sig.type === 'answer') {
                await peers[sig.from]?.setRemoteDescription(sig.sdp);
            } else if (sig.type === 'candidate') {
                await peers[sig.from]?.addIceCandidate(new RTCIceCandidate(sig.candidate));
            }
        }
    </script>
</body>
</html>
